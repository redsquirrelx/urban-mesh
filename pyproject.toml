[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urbanmesh"
version = "1.4.0"
description = "Municipal mobility and fleet operations platform"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
urbanmesh = "urbanmesh.presentation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
